<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Gaming Inc Case Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Questrial&family=Rozha+One&display=swap" rel="stylesheet">
<style>
/* Plan: one calm light world ("dawn mist"), one idea per scene, thin lines, slow breathing rings.
   Layout idea: left aligned large type, logo locked top right, controls along the bottom edge. */
:root{
  --mist:#EEF7F6;
  --ink:#0C194D;
  --ink2:#082A75;
  --teal:#57BBBF;
  --pale:#D3F2EF;
  --hi:#B6F3E8;
  --line:rgba(12,25,77,.16);
  --soft:rgba(12,25,77,.62);
  --disp:'Rozha One',Georgia,'Times New Roman',serif;
  --body:'Questrial','Helvetica Neue',Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --m:max(5vw,24px);
  --logoW:clamp(340px,16vw,420px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink2);outline-offset:3px;border-radius:4px}
.mono{font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;font-size:13px}

/* background */
.aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,#F6FBFC 0%,#E4F3F6 38%,#D2EBF1 72%,#C2E4EC 100%)}
.aura i{display:none}
.sky{position:absolute;top:0;left:0;height:100%;width:200%;display:flex;will-change:transform;animation:skydrift 190s linear infinite}
.sky svg{width:50%;height:100%;display:block;flex:none}
.sky.s2{animation-duration:120s;opacity:.85;top:6%}
.sky.s3{animation-duration:260s;opacity:.55;top:-4%}
.aura::after{content:"";position:absolute;inset:0;background:radial-gradient(70vw 55vh at 50% 105%,rgba(255,255,255,.55),transparent 70%)}
.nav .dlpdf{border:1px solid var(--teal);border-radius:999px;padding:7px 14px;background:var(--pale)}
.nav .dlpdf:hover{background:var(--hi)}
@keyframes skydrift{to{transform:translate3d(-50%,0,0)}}
.rings{position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
.rings svg{width:min(120vh,120vw);height:auto;opacity:.55}
.rings circle{fill:none;stroke:var(--ink);stroke-opacity:.07;stroke-width:1;transform-origin:center;animation:breathe 10s ease-in-out infinite}
.rings circle:nth-child(2){animation-delay:-3.3s}
.rings circle:nth-child(3){animation-delay:-6.6s}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.06)}}
body.still .sky,body.still .rings circle{animation:none}

/* logo: locked brand asset, never inside a container */
.nav{position:fixed;top:var(--m);left:var(--m);right:var(--m);z-index:30;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .5s ease}
.nav::before{content:"";position:absolute;z-index:-1;top:calc(-1*var(--m));left:calc(-1*var(--m));right:calc(-1*var(--m));bottom:-14px;background:var(--mist);border-bottom:1px solid var(--line);pointer-events:none}
.nav>*{pointer-events:auto}
.nav.gone{transform:translateY(-54px);opacity:0;transition:transform .3s cubic-bezier(.55,0,.8,.45),opacity .18s ease .02s}
.nav.gone>*{pointer-events:none}
.nav>nav{position:absolute;right:0;top:calc(50% + (14px - var(--m))/2);transform:translateY(-50%)}
.nav ul{list-style:none;display:flex;gap:34px;margin:0}
.nav ul a{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:8px 0;border-bottom:1px solid transparent;transition:border-color .3s}
.nav ul a:hover,.nav ul a:focus-visible{border-color:var(--teal)}
.logo{display:block;line-height:0}
.logo img{display:block;width:var(--logoW);height:auto;transition:width .6s ease}
body.at-cover .logo img{width:clamp(380px,22vw,480px)}

/* deck */
.deck{position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;scroll-behavior:smooth;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
body.still .deck{scroll-behavior:auto}
.scene{position:relative;min-height:auto;scroll-snap-align:start;display:flex;flex-direction:column;
  padding:var(--m) calc(var(--m) + 4vw) 56px var(--m)}
#cover{min-height:100%;padding-bottom:120px}
.eyebrow{color:var(--ink2);display:flex;align-items:center;justify-content:flex-start;gap:14px;min-height:40px}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--ink2)}
.title{font-family:var(--disp);font-weight:400;font-size:clamp(46px,7.2vw,116px);line-height:1;letter-spacing:-.01em;margin-top:clamp(20px,5vh,60px);text-wrap:balance;max-width:16ch}
.sub{margin-top:18px;color:var(--soft);max-width:52ch}
.body{margin-top:clamp(16px,3.5vh,42px);flex:1}
.sym{width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:18px;filter:url(#pencilS);overflow:visible}
.sym .f{fill:var(--ink);stroke:none}
.sym .t{stroke:var(--teal);stroke-width:2}
.mk{overflow:visible;filter:none}
.mk path{fill:none;stroke:var(--teal);stroke-linecap:round;stroke-linejoin:round;stroke-width:2.6;stroke-dasharray:1;stroke-dashoffset:0}
.mk.big path{stroke-width:9}
.mk .f{fill:var(--teal);stroke:none}
.sym.mk{width:64px;height:64px;margin:-6px 0 10px -6px}
.scene.in .mk path{animation:draw 1.5s cubic-bezier(.4,.1,.2,1) .5s both}
@keyframes draw{from{stroke-dashoffset:1}}
body.still .scene.in .mk path{animation:none}
.rv{opacity:1}
.scene.in .rv{animation:rise 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*100ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
body.still .scene.in .rv{animation:none}

/* generic item styles */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(24px,3vw,48px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:0 clamp(32px,5vw,96px)}
.item{border-top:1px solid var(--line);padding:22px 0 30px;position:relative;transition:border-color .4s}
.item::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:var(--ink);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.item:hover::before,.item:focus-within::before{width:100%}
.item .n{font-family:var(--mono);font-size:13px;letter-spacing:.18em;color:var(--teal);transition:color .3s}
.item:hover .n{color:var(--ink)}
.item h3{font-family:var(--disp);font-weight:400;font-size:clamp(26px,2.4vw,38px);line-height:1.1;margin:10px 0 10px;text-wrap:balance}
.item p{color:var(--ink2);opacity:.88;max-width:34ch}
.big{font-family:var(--disp);font-size:clamp(54px,6vw,100px);line-height:1;margin:14px 0 4px;display:block}
.rows .item{display:grid;grid-template-columns:70px minmax(200px,.9fr) 1.4fr;gap:8px 24px;align-items:baseline;padding:26px 0 28px}
.rows .item h3{margin:0}
.rows .item p{max-width:46ch}
.rows .item:hover{transform:translateX(8px);transition:transform .4s}
.statement .item{display:grid;grid-template-columns:70px 1fr;align-items:baseline;padding:26px 0}
.statement .item h3{font-size:clamp(30px,4vw,64px);margin:0}
.statement .item:hover h3{color:var(--ink2)}
.glass{background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);border-radius:20px}

/* summary & outcomes */
.lead{font-size:clamp(20px,1.9vw,28px);line-height:1.5;max-width:44ch;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(36px,8vh,88px)}
.stat{border-top:1px solid var(--ink);padding-top:16px}
.num{font-family:var(--disp);font-size:clamp(56px,6.5vw,108px);line-height:1;display:block;font-variant-numeric:tabular-nums}
.cover-num{font-size:26cqw;line-height:1}
.pa input{position:absolute;opacity:0;pointer-events:none}
.pat{display:flex;gap:10px;margin-bottom:clamp(14px,2.5vh,26px)}
.pat label{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:9px 18px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--ink);transition:background .3s,color .3s}
#pa1:checked ~ .pat label[for=pa1],#pa2:checked ~ .pat label[for=pa2]{background:var(--ink);color:#fff;border-color:var(--ink)}
#pa1:focus-visible ~ .pat label[for=pa1],#pa2:focus-visible ~ .pat label[for=pa2]{outline:2px solid var(--ink2);outline-offset:3px}
.pas{display:flex;align-items:center;gap:clamp(24px,4vw,64px);flex-wrap:wrap}
.phone{width:clamp(140px,min(12vw,22vh),200px);aspect-ratio:9/18.5;background:var(--ink);border-radius:34px;padding:9px;box-shadow:0 30px 60px -28px rgba(12,25,77,.5)}
.phone .scr{width:100%;height:100%;border-radius:26px;overflow:hidden;background:#000}
.phone img,.fbi img{display:block;width:100%;height:100%;object-fit:cover}
.fb{width:clamp(240px,min(21vw,32vh),330px);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px -32px rgba(12,25,77,.35);border:1px solid rgba(12,25,77,.08)}
.fbh{display:flex;align-items:center;gap:10px;padding:12px 14px}
.fbh i{width:34px;height:34px;border-radius:50%;background:var(--pale);flex:none}
.fbh b{display:block;font-size:14px;line-height:1.2;font-weight:400;color:var(--ink)}
.fbh span{display:block;font-size:12px;color:var(--soft)}
.fbt{padding:0 14px 12px;font-size:14px;line-height:1.4;color:var(--ink)}
.fbi{aspect-ratio:1/1}
.fbc{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#F2F5F7;font-size:13px;color:var(--ink)}
.fbc em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);padding:6px 12px;border-radius:6px}
.pa .pas .v2{display:none}
#pa2:checked ~ .pas .v1{display:none}
#pa2:checked ~ .pas .v2{display:block}
.pak{display:grid;gap:12px;min-width:200px}
.pak .stat{margin:0;padding-top:10px}
.pak .num{font-size:clamp(38px,3.6vw,56px)}
.pak .stat .cap{margin-top:2px;font-size:15px}
.fade{position:fixed;left:0;right:0;bottom:0;height:110px;z-index:35;pointer-events:none;background:linear-gradient(to bottom,rgba(238,247,246,0),var(--mist) 78%)}
.compact .title{font-size:clamp(40px,5.2vw,84px);margin-top:clamp(9px,1.75vh,22px)}
.compact .body{margin-top:clamp(8px,1.5vh,16px)}
.compact .sub{margin-top:10px}
.compact .title{max-width:22ch}
#summary .lead{font-size:clamp(15px,1.45vw,21px);line-height:1.5;max-width:92ch}
#summary .stats{margin-top:clamp(12px,2vh,24px)}
#summary .stat .num{font-size:clamp(34px,3.6vw,56px)}
#summary .stat{padding-top:12px}
#summary .stat .cap{margin-top:4px}
.roi{margin-top:clamp(10px,2vh,22px);margin-bottom:clamp(56px,9vh,84px);padding-top:clamp(12px,2vh,22px);border-top:1px solid rgba(12,25,77,.16)}
.roihead{display:flex;justify-content:space-between;color:var(--ink2);letter-spacing:.12em;font-size:12px;margin-bottom:8px}
.roileg{display:flex;align-items:center;gap:8px}.roileg i{width:12px;height:12px;border-radius:3px;display:inline-block}.roileg i.b1{margin-left:10px}
.roi i.b0{background:rgba(12,25,77,.28)}.roi i.b1{background:var(--teal)}
.roirow{display:grid;grid-template-columns:clamp(110px,12vw,170px) 1fr clamp(80px,8vw,120px);align-items:center;gap:16px;padding:clamp(5px,1vh,10px) 0}
.roil{font-family:var(--disp);font-size:clamp(16px,1.5vw,24px);color:var(--ink)}
.roibars{display:grid;gap:6px}
.roib{position:relative;height:clamp(20px,3.2vh,30px);background:rgba(12,25,77,.05);border-radius:6px;overflow:hidden}
.roib i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;transition:width 1.4s cubic-bezier(.2,.8,.2,1);transition-delay:calc(.5s + var(--k)*.25s)}
.roib i.b1{transition-delay:calc(.9s + var(--k)*.25s)}
.scene.in .roib i{width:var(--w)}
.roib em{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:clamp(11px,.95vw,14px);color:var(--ink);white-space:nowrap;font-family:var(--mono,inherit)}
.roig{color:var(--ink2);text-align:right;font-size:12px}
body.still .roib i{transition:none}
#objectives .grid2{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 clamp(20px,2.4vw,36px)}
@media(max-width:900px){#objectives .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){#objectives .grid2{grid-template-columns:1fr}}
#objectives .item{padding:14px 0 16px}
#objectives .item h3{font-size:clamp(19px,1.7vw,26px);margin:6px 0 6px}
#objectives .item p{max-width:none;font-size:clamp(13px,1vw,15px);line-height:1.45}
#objectives .goal-s{margin-top:8px}
#media-engine .cols,#capital-raise .cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(24px,3vw,48px)}
#media-engine .item,#capital-raise .item{padding:16px 0 20px}
#media-engine .item p,#capital-raise .item p{max-width:none}
#capital-raise .big{font-size:clamp(36px,4vw,64px);margin:6px 0 2px}
@media(max-width:520px){#media-engine .cols,#capital-raise .cols{grid-template-columns:1fr}}
#count{white-space:nowrap}
.scene.fold{border-top:1px solid var(--line)}
.scene.fold:not(.open){cursor:pointer;padding-top:calc(var(--m)/2);padding-bottom:18px}
.scene.fold:not(.open)>*:not(.eyebrow):not(.title):not(.thead):not(.foldbtn){display:none}
.scene.fold:not(.open) .title{font-size:clamp(26px,3vw,42px);margin-top:4px}
.scene.fold:not(.open) .thead .sym{display:none}
.scene.fold:not(.open) .thead{display:block}
.foldbtn{position:absolute;top:calc(var(--m)/2 + 6px);right:calc(var(--m) + 4vw);z-index:5;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;border:1px solid var(--teal);background:var(--pale);color:var(--ink);font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.foldbtn:hover{background:var(--hi)}
.foldbtn i{width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translateY(-2px);transition:transform .3s}
.scene.open .foldbtn i{transform:rotate(-135deg) translateY(-2px)}
@media(max-width:860px){.scene.fold:not(.open){padding-top:var(--m)}.scene.fold:not(.open) .eyebrow{position:static}.scene.fold:not(.open) .foldbtn{top:calc(var(--m) + 2px)}.scene.fold.open .foldbtn{top:calc(var(--m) + 112px)}}
@media(max-width:480px){.bar{gap:8px}.bar .left{display:flex;gap:6px}.bar .pill{padding:8px 12px;font-size:12px}#count{font-size:11px;letter-spacing:.1em}.bar .zmark{display:none}}
@media(max-width:520px){#objectives .item{padding:9px 0 11px}#objectives .item h3{font-size:19px;margin:3px 0 3px}#objectives .goal-s{margin-top:6px;padding:4px 10px 4px 8px;font-size:10px}.jny .jc{padding-top:3px;padding-bottom:3px}.jrow{gap:2px!important}}
@keyframes jglow{0%{box-shadow:0 0 0 0 rgba(87,187,191,0)}45%{box-shadow:0 0 30px 6px rgba(87,187,191,.6)}100%{box-shadow:0 0 16px 2px rgba(87,187,191,.3)}}
.scene.in .jres{animation:jglow 2.2s ease-out calc(1.3s + var(--k,0)*.3s) both}
body.still .scene.in .jres{animation:none}
.jny{display:grid;gap:clamp(8px,1.4vh,14px)}
.jhead,.jrow{display:grid;grid-template-columns:1.15fr 1fr 1.15fr 1.1fr 1fr;gap:clamp(18px,2vw,30px)}
.jhead{color:var(--ink2);letter-spacing:.14em;font-size:12px;padding:0 4px}
.jc{position:relative;padding:clamp(10px,1.6vh,16px) 4px;font-size:clamp(13px,1.05vw,16px);line-height:1.4;color:var(--ink);display:flex;flex-direction:column;justify-content:center}
.jc:not(:last-child)::after{content:'';position:absolute;right:calc(-1 * clamp(18px,2vw,30px) + 3px);top:50%;width:calc(clamp(18px,2vw,30px) - 6px);height:2px;background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform .7s ease;transition-delay:calc(.6s + var(--k,0)*.25s)}
.scene.in .jc:not(:last-child)::after{transform:scaleX(1)}
body.still .jc::after{transition:none}
.jch{border:1px dashed rgba(12,25,77,.3);border-radius:12px;background:rgba(12,25,77,.05);padding:clamp(10px,1.6vh,16px) 14px}
.jch b{font-family:var(--disp);font-weight:400;font-size:clamp(16px,1.35vw,21px);line-height:1.15;color:var(--ink)}
.jch span{margin-top:4px;color:var(--ink2);font-size:clamp(12px,.95vw,14px)}
.jres{border:1px solid var(--teal);border-radius:12px;background:var(--pale);padding:clamp(10px,1.6vh,16px) 14px}
.jres .num{font-size:clamp(24px,2.3vw,36px);white-space:nowrap}
.jny{margin-bottom:clamp(60px,10vh,90px)}
.jny .jc{padding-top:clamp(6px,1vh,10px);padding-bottom:clamp(6px,1vh,10px)}
.jny .jch,.jny .jres{padding:clamp(7px,1.1vh,11px) 14px}
.jres span:last-child{color:var(--ink2);font-size:clamp(11px,.9vw,13px);margin-top:2px}
@media(max-width:900px){.jhead{display:none}.jrow{grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid rgba(12,25,77,.16)}.jc::after{display:none}.jc::before{content:attr(data-l);font-family:var(--mono,monospace);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}}
.cologos{display:flex;align-items:center;gap:clamp(14px,1.6vw,22px);margin-top:clamp(18px,3vh,30px)}
.cologos img{height:clamp(32px,4.9vh,48px);width:auto;display:block;filter:grayscale(1)}
.cologos .sub{display:flex;flex-direction:column;justify-content:center;gap:3px;height:clamp(32px,4.9vh,48px);padding-left:clamp(14px,1.6vw,22px);border-left:1px solid rgba(12,25,77,.28);color:var(--ink,#0C194D)}
.cologos .sub b{font-family:'Rozha One',serif;font-weight:400;font-size:clamp(15px,2.2vh,22px);line-height:1;letter-spacing:.01em}
.cologos .sub span{font-family:'DM Mono',monospace;font-size:clamp(8px,1.1vh,10.5px);letter-spacing:.16em;text-transform:uppercase;line-height:1;opacity:.75}
.bagrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,24px)}
.bacard{position:relative;display:flex;flex-direction:column;gap:10px;padding:clamp(18px,2vw,30px);border:1px solid rgba(12,25,77,.16);border-radius:14px;min-height:clamp(220px,34vh,340px);background:rgba(255,255,255,.35)}
.bacard .mono{color:var(--ink2);letter-spacing:.12em}
.bacard .num{font-size:clamp(30px,3.3vw,54px);line-height:1.05;margin-top:auto;white-space:nowrap}
.bacard p{margin:0;font-size:clamp(14px,1.1vw,17px);line-height:1.5;color:var(--ink2)}
.bagrid.before .bacard{background:rgba(12,25,77,.06);border-style:dashed}
.bagrid.before .num{color:var(--ink2);opacity:.75;white-space:normal}
.bagrid.after .bacard{background:var(--pale);border-color:var(--teal)}
.batag{align-self:flex-start;margin-top:6px;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--hi)!important;font-size:11px}
@media(max-width:900px){.bagrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.bagrid{grid-template-columns:1fr}.bacard{min-height:0}}
#outcomes .num{font-size:clamp(36px,3.9vw,64px);white-space:nowrap}
.scene>.goal{align-self:flex-start;width:auto}
.note{margin-top:22px;font-size:12px;letter-spacing:.14em;color:var(--soft)}
.stat .cap{display:block;margin-top:6px;color:var(--ink2)}
.stat h3{font-family:var(--disp);font-weight:400;font-size:26px;margin-top:6px}

function loops(cx,cy,r,seed){
  var out='',k,i;
  for(k=0;k<3;k++){
    var ph=seed+k*2.1,a0=-1.35+k*.85+seed*.3,sweep=Math.PI*2*(1.05+.035*k),steps=72,d='';
    for(i=0;i<=steps;i++){

          rr=r*(1+.035*Math.sin(a*2+ph)+.02*Math.cos(a*3+ph*1.7)+(t-.5)*.06*(k%2?1:-1)),
          x=cx+rr*Math.cos(a)*(1+.025*k),y=cy+rr*Math.sin(a)*(1-.02*k);
      d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);
    }
    out+='<path d="'+d+'" opacity="'+[.9,.65,.8][k]+'" stroke-width="'+[1.5,1.1,1.3][k]+'"/>';
  }
  return out;
}
/* marker circles: loose teal loops that spiral outward and exit past the start, like a highlighter pen */
function marker(cx,cy,rx,ry,rot,seed,turns){
  var steps=150,d='',i,c=Math.cos(rot),s=Math.sin(rot);
  for(i=0;i<=steps;i++){
    var t=i/steps,a=-2.3+seed*.5+Math.PI*2*turns*t,g=.9+.11*t;
    if(t>.86){var u=(t-.86)/.14;g+=.26*u*u}

    d+=(i?'L':'M')+(cx+x*c-y*s).toFixed(2)+' '+(cy+x*s+y*c).toFixed(2);
  }
  return '<path pathLength="1" d="'+d+'"/>';
}

    if(o.n)h+='<text x="'+X(i)+'" y="'+(H-mb+52)+'" text-anchor="middle">'+o.n+'</text>';
  });
  M.forEach(function(o,i){
    var same=o.d===o.v;
    h+='<g data-g="v"><circle cx="'+X(i)+'" cy="'+Y(o.v)+'" r="5" fill="#EEF7F6" stroke="#57BBBF" stroke-width="2"/><text class="lbl" x="'+X(i)+'" y="'+(Y(o.v)-14)+'" text-anchor="middle">'+o.v+'%</text></g>';
    if(!same)h+='<g data-g="d"><circle cx="'+X(i)+'" cy="'+Y(o.d)+'" r="5" fill="#0C194D"/><text class="lbl" x="'+X(i)+'" y="'+(Y(o.d)+26)+'" text-anchor="middle">'+o.d+'%</text></g>';
    else h+='<g data-g="d"><circle cx="'+X(i)+'" cy="'+Y(o.d)+'" r="3" fill="#0C194D"/></g>';
  });
  M.forEach(function(o,i){
    h+='<rect class="hit" tabindex="0" data-i="'+i+'" x="'+(X(i)-60)+'" y="'+mt+'" width="120" height="'+ph+'" fill="transparent" aria-label="'+o.m+', share of deposits '+o.d+' percent, share of deposit value '+o.v+' percent"/>';
  });
  svg.innerHTML=h;
  var lines=$$('.ln',svg);lines.forEach(function(l){var L=l.getTotalLength();l.style.strokeDasharray=L;l.style.strokeDashoffset=0;l.dataset.len=L});
  function draw(){lines.forEach(function(l){var L=+l.dataset.len;l.style.transition='none';l.style.strokeDashoffset=L;l.getBoundingClientRect();l.style.transition='stroke-dashoffset 2s cubic-bezier(.3,.6,.2,1)';l.style.strokeDashoffset=0})}
  var seen=false;new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!seen&&!document.body.classList.contains('still')){seen=true;draw()}})},{root:deck,threshold:.6}).observe($('#crypto-shift'));
  function show(i){var o=M[i],wrap=svg.parentNode,r=svg.getBoundingClientRect(),w=wrap.getBoundingClientRect();
    var tg={d:$('[data-g="d"]',svg).style.display!=='none',v:$('[data-g="v"]',svg).style.display!=='none'};
    tip.innerHTML='<b>'+o.m+(o.n?' ('+o.n+')':'')+'</b>'+(tg.d?'Share of deposits '+o.d+'%<br>':'')+(tg.v?'Share of deposit value '+o.v+'%':'');
    var top=Math.min(Y(o.d),Y(o.v));
    tip.style.left=(r.left-w.left+X(i)/W*r.width)+'px';tip.style.top=(r.top-w.top+top/H*r.height-8)+'px';tip.classList.add('on')}
  $$('.hit',svg).forEach(function(r){var i=+r.dataset.i;
    r.addEventListener('pointerenter',function(){show(i)});r.addEventListener('focus',function(){show(i)});
    r.addEventListener('pointerleave',function(){tip.classList.remove('on')});r.addEventListener('blur',function(){tip.classList.remove('on')})});
  $$('.tog').forEach(function(b){b.onclick=function(){
    var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));
    $$('[data-g="'+b.dataset.s+'"]',svg).forEach(function(g){g.style.display=on?'':'none'})}});
})();

/* ---------- devices ---------- */
(function(){
  var COPY={
   deck:['Investor deck','Investor decks supported two raises, USD $250K and USD $1M.','Cover of the OO5 investor deck. Financial slides are left out of this view'],
   email:['Promotional email','The match deposit offer and the card and crypto payments announcement, designed for the email channel and shown here as it reads on a tablet.','OO5 email design'],
   kit:['Media Kit','One approved source for sales, sponsors and partners. Brand voice, logo files, wallpapers, live promotions and compliance copy sit in one place.','OO5 Media Kit']};
  var cp=$('#devCopy');
  function pick(k){
    $$('.tab').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.k===k))});
    $$('.dev').forEach(function(d){d.classList.toggle('on',d.dataset.k===k)});

    scale();mediaSync();
  }
  $$('.tab').forEach(function(t){t.onclick=function(){pick(t.dataset.k)}});
  var sl=$$('.ds'),si=0;
  function slide(n){si=(n+sl.length)%sl.length;sl.forEach(function(s,k){s.classList.toggle('on',k===si)});$('#sCount').textContent=(si+1)+' / '+sl.length}
  $('#sNext').onclick=function(){slide(si+1)};$('#sPrev').onclick=function(){slide(si-1)};
  $('#lscreen').onclick=function(){slide(si+1)};
  function scale(){var sc=$('#lscreen'),w=sc.clientWidth;if(w)$('#slides').style.setProperty('--s',w/1280)}
  window.addEventListener('resize',scale);
  pick('deck');
  if('ResizeObserver' in window)new ResizeObserver(scale).observe($('#lscreen'));
})();

/* ---------- video control ---------- */
function mediaSync(){
  var sc=scenes[cur];
  $$('video').forEach(function(v){
    var vis=sc.contains(v)&&v.offsetParent!==null&&!v.dataset.paused;
    if(vis&&!still){var p=v.play();if(p&&p.catch)p.catch(function(){})}else v.pause();
  });
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-v]');if(!b)return;
  var v=b.parentNode.querySelector('video');
  if(v.paused){v.dataset.paused='';v.play().catch(function(){});b.textContent='Pause'}else{v.dataset.paused='1';v.pause();b.textContent='Play'}
});

/* ---------- reel + lightbox ---------- */
(function(){
  var r=$('#reel');
  $('#rNext').onclick=function(){r.scrollBy({left:r.clientWidth*.7,behavior:'smooth'})};

  document.addEventListener('click',function(e){
    var lbx=$('#lightbox'),lv=$('#lbVid'),bv=e.target.closest('[data-lbv]');
    if(bv){lbx.classList.toggle('sm',bv.dataset.sm==='1');lbx.classList.add('vid','on');lv.src=bv.dataset.lbv;lv.muted=false;var pr=lv.play();if(pr&&pr.catch)pr.catch(function(){});$('#closeLb').focus();return}
    var b=e.target.closest('[data-lb]');if(!b)return;

    $('#lbImg').src=b.dataset.lb;$('#lbImg').alt=b.dataset.alt;lbx.classList.add('on');$('#closeLb').focus();
  });
  document.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;var f=c.dataset.f;$$('.chip').forEach(function(x){x.setAttribute('aria-selected',String(x===c))});$$('.srcard').forEach(function(s){s.style.display=(f==='all'||s.dataset.c===f)?'':'none'});var rr=$('#srReel');if(rr)rr.scrollLeft=0;mediaSync()});
  function closeLb(){var lv=$('#lbVid');lv.pause();$('#lightbox').classList.remove('on')}
  $('#closeLb').onclick=closeLb;
  $('#lightbox').addEventListener('click',function(e){if(e.target===this)closeLb()});
})();

(function(){

   '“Zen Management brought far more than content creation. Their team developed a clear content strategy, promo calendar, optimized platform specific messaging, identified high performing creative themes, and continuously refined performance based on analytics.”',
